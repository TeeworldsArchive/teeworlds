name: Steam Beta

# Builds the Linux + Windows packages and pushes them to a Steam beta branch.
#
# Triggered by the "Build Test" workflow (build.yaml) *after it succeeds* on the
# mods branch, and it checks out the exact commit that passed those tests, so a
# revision that fails the build tests is never uploaded to Steam.
# Manual workflow_dispatch runs bypass that gate (useful to re-publish, or to
# preview the depot mapping without uploading).
#
# Required repository variables (Settings -> Secrets and variables -> Actions):
#   STEAM_APP_ID          Steam AppID
#   STEAM_DEPOT_LINUX     depot id for the Linux content
#   STEAM_DEPOT_WINDOWS   depot id for the Windows content
#   STEAM_BETA_BRANCH     optional, defaults to "beta"
#
# Required secrets:
#   STEAM_USERNAME        dedicated Steamworks build account
#   STEAM_PASSWORD        its password
#   STEAM_CONFIG_VDF      optional: base64 of the account's config.vdf login token
#   STEAM_GUARD_CODE      optional: Steam Guard code (when no cached token is used)
#
# Optional secrets for Steam rich presence ("playing <map> in <gamemode>"):
#   STEAMWORKS_SDK_REPOSITORY  private repository holding the Steamworks SDK
#                              (either the SDK at its root or in an sdk/ folder)
#   STEAMWORKS_SDK_TOKEN       token that can read that repository
# When the repository is not configured the packages are built without Steamworks
# support: the game still runs, it just never sets a rich presence string. Note
# that Steam cannot hand the SDK to the build for us, it is not redistributable
# with the source tree.
#
# The "default" branch can never be set live automatically: SetLive only accepts
# a beta branch, which is exactly what this workflow targets.

on:
  # Gate publication on the build tests: this fires when "Build Test" finishes
  # on mods, and the jobs below additionally require conclusion == success.
  workflow_run:
    workflows: ["Build Test"]
    types: [completed]
    branches: [mods]
  workflow_dispatch:
    inputs:
      branch:
        description: Beta branch to set live
        required: false
        default: beta
      preview:
        description: Only validate the file mapping (upload nothing)
        required: false
        type: boolean
        default: false

concurrency:
  # Steam does not like two builds being uploaded for the same app at once.
  group: steam-beta
  cancel-in-progress: false

permissions:
  contents: read

env:
  SDL3_VERSION: "3.4.0"
  ZLIB_NG_VERSION: "2.3.3"
  SPNG_VERSION: "0.7.4"
  CMAKE_VERSION: "3.31.6"
  # Valve's official Steam Runtime SDK: building inside it gives exactly the
  # glibc/library stack of the Steam Linux Runtime
  STEAM_BASE_IMAGE: "registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk:latest"

jobs:
  linux:
    name: Linux package (Steam Runtime 4.0)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    # Secrets cannot be referenced in `if:` directly, so expose it as an env var.
    env:
      STEAMWORKS_SDK_REPOSITORY: ${{ secrets.STEAMWORKS_SDK_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Checkout Steamworks SDK
        if: ${{ env.STEAMWORKS_SDK_REPOSITORY != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.STEAMWORKS_SDK_REPOSITORY }}
          token: ${{ secrets.STEAMWORKS_SDK_TOKEN }}
          path: steamworks-sdk
          persist-credentials: false

      - name: Locate Steamworks SDK
        if: ${{ env.STEAMWORKS_SDK_REPOSITORY != '' }}
        run: |
          set -euo pipefail
          # Accept both layouts: the SDK at the checkout root, or nested in sdk/.
          if [ -f "$GITHUB_WORKSPACE/steamworks-sdk/public/steam/steam_api.h" ]; then
            sdk_root="$GITHUB_WORKSPACE/steamworks-sdk"
          elif [ -f "$GITHUB_WORKSPACE/steamworks-sdk/sdk/public/steam/steam_api.h" ]; then
            sdk_root="$GITHUB_WORKSPACE/steamworks-sdk/sdk"
          else
            echo "Steamworks SDK checkout must contain public/steam/steam_api.h" >&2
            exit 1
          fi
          # The build itself runs inside the Steam Runtime container, where the
          # repository is mounted at /src.
          sdk_subdir="${sdk_root#"$GITHUB_WORKSPACE"/}"
          echo "STEAMWORKS_SDK_ROOT=/src/$sdk_subdir" >> "$GITHUB_ENV"
          echo "using Steamworks SDK at $sdk_root"

      - name: Note missing Steamworks SDK
        if: ${{ env.STEAMWORKS_SDK_REPOSITORY == '' }}
        run: echo "::warning::STEAMWORKS_SDK_REPOSITORY is not set, building without Steam rich presence"

      - name: Cache Linux dependencies
        uses: actions/cache@v4
        with:
          path: .ci/linux-prefix
          key: linux-deps-${{ runner.os }}-${{ env.SDL3_VERSION }}-${{ env.ZLIB_NG_VERSION }}-${{ env.SPNG_VERSION }}-${{ hashFiles('scripts/ci/linux-deps.sh', 'scripts/ci/build-sdl3.sh') }}

      - name: Build missing dependencies (SDL3, zlib-ng, libspng)
        env:
          PREFIX: /src/.ci/linux-prefix
        run: |
          docker run --rm --entrypoint bash \
            -v "$PWD:/src" -w /src \
            -e PREFIX -e SDL3_VERSION -e ZLIB_NG_VERSION -e SPNG_VERSION -e CMAKE_VERSION \
            "$STEAM_BASE_IMAGE" \
            /src/scripts/ci/linux-deps.sh

      - name: Build and stage the package
        run: |
          docker run --rm --entrypoint bash \
            -v "$PWD:/src" -w /src \
            -e PREFIX=/src/.ci/linux-prefix \
            -e STEAMWORKS_SDK_ROOT="${STEAMWORKS_SDK_ROOT:-}" \
            "$STEAM_BASE_IMAGE" \
            /src/scripts/ci/linux-build.sh

      - name: Verify bundled runtime libraries
        run: |
          set -euo pipefail
          test -d .ci/staging/linux/lib
          libs=$(find .ci/staging/linux/lib -maxdepth 1 -type f | wc -l)
          echo "bundled runtime libraries: $libs"
          test "$libs" -ge 5
          find .ci/staging/linux -maxdepth 1 | sort
          # The executables must look for the bundled libraries relative to themselves.
          readelf -d .ci/staging/linux/ArchiveClient | grep -q '\$ORIGIN/lib'
          echo "ArchiveClient runs from \$ORIGIN/lib"
          if [ -n "${STEAMWORKS_SDK_ROOT:-}" ]; then
            # A Steam build must ship libsteam_api: the client does not provide it.
            test -f .ci/staging/linux/lib/libsteam_api.so
            readelf -d .ci/staging/linux/ArchiveClient | grep -q 'libsteam_api.so'
            echo "Steam rich presence library bundled"
          fi

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: steam-linux
          path: .ci/staging/linux
          if-no-files-found: error

  windows:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 90
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    # Secrets cannot be referenced in `if:` directly, so expose it as an env var.
    env:
      STEAMWORKS_SDK_REPOSITORY: ${{ secrets.STEAMWORKS_SDK_REPOSITORY }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Checkout Steamworks SDK
        if: ${{ env.STEAMWORKS_SDK_REPOSITORY != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.STEAMWORKS_SDK_REPOSITORY }}
          token: ${{ secrets.STEAMWORKS_SDK_TOKEN }}
          path: steamworks-sdk
          persist-credentials: false

      - name: Locate Steamworks SDK
        if: ${{ env.STEAMWORKS_SDK_REPOSITORY != '' }}
        shell: pwsh
        run: |
          $checkoutRoot = Join-Path $env:GITHUB_WORKSPACE "steamworks-sdk"
          # Accept both layouts: the SDK at the checkout root, or nested in sdk/.
          $rootManifest = Join-Path $checkoutRoot "public/steam/steam_api.h"
          $nestedRoot = Join-Path $checkoutRoot "sdk"
          $nestedManifest = Join-Path $nestedRoot "public/steam/steam_api.h"
          if (Test-Path $rootManifest) {
            $sdkRoot = $checkoutRoot
          } elseif (Test-Path $nestedManifest) {
            $sdkRoot = $nestedRoot
          } else {
            throw "Steamworks SDK checkout must contain public/steam/steam_api.h"
          }
          "STEAMWORKS_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "using Steamworks SDK at $sdkRoot"

      - name: Note missing Steamworks SDK
        if: ${{ env.STEAMWORKS_SDK_REPOSITORY == '' }}
        run: echo "::warning::STEAMWORKS_SDK_REPOSITORY is not set, building without Steam rich presence"

      - name: Prepare MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            zlib-ng:p
            zstd:p
            freetype:p
            opus:p
            opusfile:p
            openssl:p
            curl:p
            libspng:p

      - name: Cache SDL3
        uses: actions/cache@v4
        with:
          path: .ci/win-prefix
          key: win-deps-${{ runner.os }}-${{ hashFiles('scripts/ci/build-sdl3.sh') }}-${{ env.SDL3_VERSION }}

      - name: Build SDL3 from source
        run: |
          PREFIX="$PWD/.ci/win-prefix" JOBS="$(nproc)" \
            SDL3_VERSION="$SDL3_VERSION" \
            bash scripts/ci/build-sdl3.sh

      - name: Configure and build
        run: |
          # cygpath -m keeps forward slashes: native CMake accepts them and they
          # avoid backslash-escaping surprises in generated install scripts.
          prefix="$(cygpath -m "$PWD/.ci/win-prefix")"
          # MSYS2 installs every pacboy DLL into <prefix>/bin (e.g. /ucrt64/bin).
          # file(GET_RUNTIME_DEPENDENCIES) does not search PATH on Windows, so
          # point the runtime bundling at that directory explicitly. CMakeLists
          # also derives it from the compiler, this keeps it obvious and lets a
          # differently laid out toolchain be handled with one variable.
          msys_prefix="$(cygpath -m "${MINGW_PREFIX:-/ucrt64}")"
          steam_args=()
          if [ -n "${STEAMWORKS_SDK_ROOT:-}" ]; then
            steam_args+=("-DSTEAM=ON" "-DSTEAM_SDK_PATH=$(cygpath -m "$STEAMWORKS_SDK_ROOT")")
          fi
          cmake -S . -B .ci-build/win -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$prefix" \
            -DDEV=OFF \
            -DBUNDLE_RUNTIME_DEPS=ON \
            -DRUNTIME_DEPS_STRICT=ON \
            -DRUNTIME_DEPS_EXTRA_DIRS="$msys_prefix/bin" \
            "${steam_args[@]}"
          cmake --build .ci-build/win --target ArchiveClient ArchiveServer -j "$(nproc)"

      - name: Stage the package
        run: |
          export PATH="$PWD/.ci/win-prefix/bin:${MINGW_PREFIX:-/ucrt64}/bin:$PATH"
          rm -rf .ci/staging/windows
          # -DRUNTIME_DEPS_STRICT=ON makes the install fail if any dependency is
          # unresolved; the assertions below additionally pin the MSYS2-provided
          # DLLs so a wrong search path can never silently ship a package that
          # only runs on a machine with MSYS2 installed.
          cmake --install .ci-build/win --component portable --prefix "$(cygpath -m "$PWD/.ci/staging/windows")"
          dlls=$(find .ci/staging/windows -maxdepth 1 -iname '*.dll' | wc -l)
          echo "bundled DLLs: $dlls"
          test "$dlls" -ge 5
          missing=0
          for pattern in \
            'SDL3.dll' \
            'libspng*.dll' \
            'libopus-*.dll' \
            'libopusfile-*.dll' \
            'libfreetype-*.dll' \
            'libz-ng*.dll' \
            'libssl-*.dll' \
            'libcrypto-*.dll' \
            'libcurl-*.dll' \
            'libgcc_s_*.dll' \
            'libstdc++-*.dll' \
            'libwinpthread-*.dll'; do
            if ! compgen -G ".ci/staging/windows/$pattern" > /dev/null; then
              echo "::error::runtime DLL not bundled: $pattern"
              missing=1
            fi
          done
          test "$missing" -eq 0
          if [ -n "${STEAMWORKS_SDK_ROOT:-}" ]; then
            # A Steam build must ship steam_api64.dll: the client does not provide it.
            test -f .ci/staging/windows/steam_api64.dll
            echo "Steam rich presence DLL bundled"
          fi
          ls .ci/staging/windows

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: steam-windows
          path: .ci/staging/windows
          if-no-files-found: error

  deploy:
    name: Upload to Steam (${{ github.event.inputs.branch || vars.STEAM_BETA_BRANCH || 'beta' }})
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')) && vars.STEAM_APP_ID != '' && vars.STEAM_DEPOT_LINUX != '' && vars.STEAM_DEPOT_WINDOWS != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: steam-linux
          path: content/linux
      - uses: actions/download-artifact@v4
        with:
          name: steam-windows
          path: content/windows

      - name: Generate app_build.vdf
        env:
          APP_ID: ${{ vars.STEAM_APP_ID }}
          DEPOT_LINUX: ${{ vars.STEAM_DEPOT_LINUX }}
          DEPOT_WINDOWS: ${{ vars.STEAM_DEPOT_WINDOWS }}
          BETA_BRANCH: ${{ github.event.inputs.branch || vars.STEAM_BETA_BRANCH || 'beta' }}
          PREVIEW: ${{ github.event.inputs.preview }}
          DESCRIPTION: ${{ github.event.workflow_run.head_branch || github.ref_name }} ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          args=(
            --app-id "$APP_ID"
            --content-root "$PWD/content"
            --output "$PWD/steam-scripts/app_build_${APP_ID}.vdf"
            --desc "$DESCRIPTION"
            --depot "linux=${DEPOT_LINUX}=linux"
            --depot "windows=${DEPOT_WINDOWS}=windows"
          )
          if [ "$PREVIEW" = "true" ]; then
            args+=(--preview)
          else
            args+=(--set-live "$BETA_BRANCH")
          fi
          python3 scripts/ci/steam-vdf.py "${args[@]}"
          echo "--- app_build.vdf ---"
          cat "steam-scripts/app_build_${APP_ID}.vdf"

      - name: Restore cached Steam login token
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          set -euo pipefail
          if [ -z "${STEAM_CONFIG_VDF:-}" ]; then
            echo "No STEAM_CONFIG_VDF secret; will log in with username/password."
            exit 0
          fi
          # The location of steamcmd's config.vdf depends on the platform and how
          # steamcmd was installed, so drop the token into every candidate path.
          for dir in \
            "$HOME/steamcmd/config" \
            "$HOME/Steam/config" \
            "$HOME/.steam/steam/config" \
            "$HOME/.local/share/Steam/config"; do
            mkdir -p "$dir"
            printf '%s' "$STEAM_CONFIG_VDF" | tr -d '\n\r ' | base64 -d > "$dir/config.vdf"
          done
          echo "restored cached Steam login token"

      - name: Install steamcmd
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1 lib32stdc++6 ca-certificates
          mkdir -p "$HOME/steamcmd"
          curl -fsSL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" \
            | tar -xz -C "$HOME/steamcmd"
          # Run from the steamcmd directory so it keeps config/ next to the tool,
          # and bootstrap the installation itself.
          cd "$HOME/steamcmd"
          ./steamcmd.sh +quit || true

      - name: Upload build to Steam
        env:
          APP_ID: ${{ vars.STEAM_APP_ID }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_GUARD_CODE: ${{ secrets.STEAM_GUARD_CODE }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          set -euo pipefail
          vdf="$PWD/steam-scripts/app_build_${APP_ID}.vdf"
          login=()
          if [ -n "${STEAM_CONFIG_VDF:-}" ]; then
            # Reusing the token avoids issuing a new Steam Guard token on every run.
            login=(+login "$STEAM_USERNAME")
          else
            login=(+login "$STEAM_USERNAME" "$STEAM_PASSWORD")
            if [ -n "${STEAM_GUARD_CODE:-}" ]; then
              login=(+set_steam_guard_code "$STEAM_GUARD_CODE" "${login[@]}")
            fi
          fi
          # Run from the steamcmd directory so config/ is read from there too.
          cd "$HOME/steamcmd"
          ./steamcmd.sh "${login[@]}" +run_app_build "$vdf" +quit
