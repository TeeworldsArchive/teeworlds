name: Build Test

on: [push, pull_request]

jobs:
  build-cmake:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macOS-latest]
        include:
        - os: ubuntu-26.04
          cmake-args: -G Ninja
          package-file: "*-linux_x86_64.tar.xz"
          archtitecture: "x86_64"
          shell: "bash"
          env:
            CFLAGS: -Werror
            CXXFLAGS: -Werror
        - os: windows-latest
          cmake-args: -G Ninja
          package-file: "*-win64.7z"
          archtitecture: "x86_64"
          shell: "msys2"
          env:
            CFLAGS: -Werror
            CXXFLAGS: -Werror
            LDFLAGS: -Werror
        - os: macOS-latest
          cmake-args: -G Ninja
          package-file: "*-macos.dmg"
          archtitecture: "arm64"
          shell: "bash"
          env:
            CFLAGS: -Werror
            CXXFLAGS: -Werror
    defaults:
      run:
        shell: ${{ matrix.shell }} {0}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Prepare MSYS2 (Windows)
      if: contains(matrix.os, 'windows')
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          zlib-ng:p
          sdl3:p
          freetype:p
          opus:p
          opusfile:p
          openssl:p
          curl:p
          libspng:p

    - name: Checkout zlib-ng
      if: contains(matrix.os, 'ubuntu')
      uses: actions/checkout@v4
      with:
        repository: zlib-ng/zlib-ng
        ref: 2.3.3
        path: ./zlib-ng

    - name: Prepare Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update -y
        sudo apt install build-essential cmake git libgl1-mesa-dev libfreetype6-dev libsdl3-dev libspng-dev libopus-dev libopusfile-dev python3 libcurl4-openssl-dev -y
        cd zlib-ng
        cmake . -DCMAKE_BUILD_TYPE=Release
        sudo make install
        sudo ldconfig

    - name: Prepare MacOS
      if: contains(matrix.os, 'macOS')
      run: |
        brew update || true
        brew install pkg-config sdl3 python3 ninja opus opusfile openssl curl libspng zlib-ng || true
        brew upgrade freetype
        sudo rm -rf /Library/Developer/CommandLineTools

    - name: Build in debug mode
      env: ${{ matrix.env }}
      run: |
        mkdir debug
        cd debug
        cmake --version
        cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Debug -Werror=dev -DDOWNLOAD_GTEST=ON -DDEV=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_DEBUG=. ..
        cmake --build . --config Debug --target everything

    - name: Test debug
      run: |
        cd debug
        cmake --build . --config Debug --target run_tests
  
    - name: Run debug server
      env: ${{ matrix.env }}
      run: |
        cd debug
        ./ArchiveServer shutdown

    - name: Build in release mode
      env: ${{ matrix.env }}
      run: |
        mkdir release
        cd release
        cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Release -Werror=dev -DDOWNLOAD_GTEST=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
        cmake --build . --config Release --target everything

    - name: Test release
      run: |
        cd release
        cmake --build . --config Release --target run_tests

    - name: Run release server
      env: ${{ matrix.env }}
      run: |
        cd release
        ./ArchiveServer shutdown

    - name: Package
      run: |
        cd release
        cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Releas -DMACOS_DO_INSTALL=ON -Werror=dev -DDOWNLOAD_GTEST=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
        cmake --build . --config Release --target everything
        cpack -V
        mkdir artifacts
        mv ${{ matrix.package-file }} artifacts

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: teeworlds-archive-${{ matrix.os }}
        path: release/artifacts

    - name: Download artifact for Release
      uses: softprops/action-gh-release@v2
      if: github.ref_type != 'tag' && github.event_name != 'pull_request' && github.ref_name == 'mods'
      with:
        tag_name: nightly
        name: Nightly Build
        files: release/artifacts/*
        prerelease: true

  build-bam:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macOS-latest]
        include:
        - os: ubuntu-26.04
          archtitecture: "x86_64"
          shell: "bash"
        - os: windows-latest
          archtitecture: "x86_64"
          shell: "msys2"
        - os: macOS-latest
          archtitecture: "arm64"
          shell: "bash"
    defaults:
      run:
        shell: ${{ matrix.shell }} {0}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Checkout bam
      uses: actions/checkout@v4
      with:
        repository: matricks/bam
        ref: a44a2c7dc16caae7ac457f17dfd14a87e7059c57
        path: ./bam

    - name: Prepare MSYS2 (Windows)
      if: contains(matrix.os, 'windows')
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          zlib-ng:p
          sdl3:p
          freetype:p
          opus:p
          opusfile:p
          openssl:p
          curl:p
          libspng:p

    - name: Checkout zlib-ng
      if: contains(matrix.os, 'ubuntu')
      uses: actions/checkout@v4
      with:
        repository: zlib-ng/zlib-ng
        ref: 2.3.3
        path: ./zlib-ng

    - name: Prepare Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update -y
        sudo apt install build-essential cmake git libgl1-mesa-dev libfreetype6-dev libsdl3-dev libspng-dev libopus-dev libopusfile-dev python3 libcurl4-openssl-dev -y
        cd bam
        ./make_unix.sh
        cd ../zlib-ng
        cmake . -DCMAKE_BUILD_TYPE=Release
        sudo make install
        sudo ldconfig

    - name: Prepare Windows
      if: contains(matrix.os, 'windows')
      run: |
        cd bam
        ./make_win64_msvc.bat

    - name: Prepare MacOS
      if: contains(matrix.os, 'macOS')
      run: |
        brew update
        brew install sdl3 opus opusfile openssl curl libspng zlib-ng || true
        cd bam
        ./make_unix.sh

    - name: Build in debug mode
      run: ./bam/bam conf=debug all
    - name: Test debug
      run: ./build/${{ matrix.archtitecture }}/debug/ArchiveServer shutdown

    - name: Build in release mode
      run: ./bam/bam conf=release all
    - name: Test release
      run: ./build/${{ matrix.archtitecture }}/release/ArchiveServer shutdown

