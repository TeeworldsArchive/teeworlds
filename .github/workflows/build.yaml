name: Build Test

on: [push, pull_request]

jobs:
  build-cmake:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  
    env:
      # The job compiles the same sources three times (debug, release, package).
      # The compiler caches make the repeats cheap across runs: ccache/sccache key
      # on file contents, so the fresh timestamps from actions/checkout do not
      # invalidate them.
      # Windows uses sccache, a native MinGW binary: the MSYS ccache cannot
      # resolve the Windows-style absolute compiler path that CMake passes it.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      SCCACHE_DIR: ${{ github.workspace }}/.ccache
      SCCACHE_CACHE_SIZE: 500M
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macOS-latest]
        include:
        - os: ubuntu-26.04
          cmake-args: -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          package-file: "*-linux_x86_64.tar.xz"
          archtitecture: "x86_64"
          shell: "bash"
          env:
            CFLAGS: -Werror
            CXXFLAGS: -Werror
        - os: windows-latest
          cmake-args: -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          package-file: "*-win64.7z"
          archtitecture: "x86_64"
          shell: "msys2"
          env:
            CFLAGS: -Werror
            CXXFLAGS: -Werror
            LDFLAGS: -Werror
        - os: macOS-latest
          cmake-args: -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          package-file: "*-macos.dmg"
          archtitecture: "arm64"
          shell: "bash"
          env:
            CFLAGS: -Werror
            CXXFLAGS: -Werror
    defaults:
      run:
        shell: ${{ matrix.shell }} {0}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Cache compiler objects (ccache/sccache)
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.ccache
        key: compiler-cache-cmake-${{ matrix.os }}-${{ github.sha }}
        restore-keys: |
          compiler-cache-cmake-${{ matrix.os }}-

    - name: Cache Homebrew downloads (macOS)
      if: contains(matrix.os, 'macOS')
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/Homebrew
        key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yaml') }}
        restore-keys: |
          brew-${{ runner.os }}-

    - name: Prepare MSYS2 (Windows)
      if: contains(matrix.os, 'windows')
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          zlib-ng:p
          zstd:p
          sdl3:p
          freetype:p
          opus:p
          opusfile:p
          openssl:p
          curl:p
          libspng:p
          7zip:p
          sccache:p

    - name: Checkout zlib-ng
      if: contains(matrix.os, 'ubuntu')
      uses: actions/checkout@v4
      with:
        repository: zlib-ng/zlib-ng
        ref: 2.3.3
        path: ./zlib-ng

    - name: Prepare Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update -y
        sudo apt install build-essential cmake git ccache libgl1-mesa-dev libfreetype6-dev libsdl3-dev libspng-dev libopus-dev libopusfile-dev python3 libcurl4-openssl-dev libzstd-dev -y
        cd zlib-ng
        cmake . -DCMAKE_BUILD_TYPE=Release
        sudo make install
        sudo ldconfig

    - name: Prepare MacOS
      if: contains(matrix.os, 'macOS')
      run: |
        brew update || true
        brew install pkg-config ccache sdl3 python3 ninja opus opusfile openssl curl libspng zlib-ng zstd || true
        brew upgrade freetype
        sudo rm -rf /Library/Developer/CommandLineTools

    - name: Build in debug mode
      env: ${{ matrix.env }}
      run: |
        mkdir debug
        cd debug
        cmake --version
        cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Debug -Werror=dev -DDOWNLOAD_GTEST=ON -DDEV=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_DEBUG=. ..
        cmake --build . --config Debug --target everything

    - name: Test debug
      run: |
        cd debug
        cmake --build . --config Debug --target run_tests
  
    - name: Run debug server
      env: ${{ matrix.env }}
      run: |
        cd debug
        ./ArchiveServer shutdown

    - name: Build in release mode
      env: ${{ matrix.env }}
      run: |
        mkdir release
        cd release
        cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Release -Werror=dev -DDOWNLOAD_GTEST=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
        cmake --build . --config Release --target everything

    - name: Test release
      run: |
        cd release
        cmake --build . --config Release --target run_tests

    - name: Run release server
      env: ${{ matrix.env }}
      run: |
        cd release
        ./ArchiveServer shutdown

    - name: Package
      run: |
        cd release
        # The Windows package must carry every MSYS2 runtime DLL. file(
        # GET_RUNTIME_DEPENDENCIES) does not search PATH, so point the bundling at
        # the MSYS2 prefix and make an unresolved dependency fail the install
        # instead of silently shipping a package that needs MSYS2 installed.
        runtime_deps=()
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          runtime_deps+=("-DRUNTIME_DEPS_STRICT=ON")
          runtime_deps+=("-DRUNTIME_DEPS_EXTRA_DIRS=$(cygpath -m "${MINGW_PREFIX:-/ucrt64}")/bin")
        fi
        cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Release -DMACOS_DO_INSTALL=ON -Werror=dev -DDOWNLOAD_GTEST=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. "${runtime_deps[@]}" ..
        cmake --build . --config Release --target everything
        cpack -V
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          archive=$(ls teeworlds-archive-*-win64.7z)
          dlls=$(7z l -ba "$archive" | grep -ci '\.dll' || true)
          echo "bundled DLLs in $archive: $dlls"
          test "$dlls" -ge 5
        fi
        mkdir artifacts
        mv ${{ matrix.package-file }} artifacts

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: teeworlds-archive-${{ matrix.os }}
        path: release/artifacts

    - name: Download artifact for Release
      uses: softprops/action-gh-release@v2
      if: github.ref_type != 'tag' && github.event_name != 'pull_request' && github.ref_name == 'mods'
      with:
        tag_name: nightly
        name: Nightly Build
        files: release/artifacts/*
        prerelease: true

  build-bam:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macOS-latest]
        include:
        - os: ubuntu-26.04
          archtitecture: "x86_64"
          shell: "bash"
        - os: windows-latest
          archtitecture: "x86_64"
          shell: "msys2"
        - os: macOS-latest
          archtitecture: "arm64"
          shell: "bash"
    defaults:
      run:
        shell: ${{ matrix.shell }} {0}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Checkout bam
      uses: actions/checkout@v4
      with:
        repository: matricks/bam
        ref: a44a2c7dc16caae7ac457f17dfd14a87e7059c57
        path: ./bam

    - name: Cache Homebrew downloads (macOS)
      if: contains(matrix.os, 'macOS')
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/Homebrew
        key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yaml') }}
        restore-keys: |
          brew-${{ runner.os }}-

    - name: Prepare MSYS2 (Windows)
      if: contains(matrix.os, 'windows')
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          zlib-ng:p
          zstd:p
          sdl3:p
          freetype:p
          opus:p
          opusfile:p
          openssl:p
          curl:p
          libspng:p
          7zip:p

    - name: Checkout zlib-ng
      if: contains(matrix.os, 'ubuntu')
      uses: actions/checkout@v4
      with:
        repository: zlib-ng/zlib-ng
        ref: 2.3.3
        path: ./zlib-ng

    - name: Prepare Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update -y
        sudo apt install build-essential cmake git libgl1-mesa-dev libfreetype6-dev libsdl3-dev libspng-dev libopus-dev libopusfile-dev python3 libcurl4-openssl-dev libzstd-dev -y
        cd bam
        ./make_unix.sh
        cd ../zlib-ng
        cmake . -DCMAKE_BUILD_TYPE=Release
        sudo make install
        sudo ldconfig

    - name: Prepare Windows
      if: contains(matrix.os, 'windows')
      run: |
        cd bam
        ./make_win64_msvc.bat

    - name: Prepare MacOS
      if: contains(matrix.os, 'macOS')
      run: |
        brew update
        brew install sdl3 opus opusfile openssl curl libspng zlib-ng zstd || true
        cd bam
        ./make_unix.sh

    - name: Build in debug mode
      run: ./bam/bam conf=debug all
    - name: Test debug
      run: ./build/${{ matrix.archtitecture }}/debug/ArchiveServer shutdown

    - name: Build in release mode
      run: ./bam/bam conf=release all
    - name: Test release
      run: ./build/${{ matrix.archtitecture }}/release/ArchiveServer shutdown

