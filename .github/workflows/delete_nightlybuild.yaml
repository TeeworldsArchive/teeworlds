name: Delete Nightly Build

on:
  push:
    branches:
      - mods

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Delete Nightly Build
      if: github.ref_type != 'tag'
      run: |
        if gh release view nightly >/dev/null 2>&1; then
          gh release delete nightly --cleanup-tag --yes
        else
          echo "skip"
        fi
      
